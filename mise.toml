[tools]
age = "1.3.2"
doppler = "3"
prek = "latest"
python = "3.14.8"
shellcheck = "0.11"
sops = "3.13.3"
uv = "latest"

[vars]
PROJECT_NAME = "{{ config_root | basename }}"
VENV_DIR = ".venv"
COLLECTIONS_PATH = "collections"
ROLES_PATH = "roles/public"

[env]
_.python.venv = { path = "{{ vars.VENV_DIR }}", create = true }
SOPS_DISABLE_VERSION_CHECK = "1"
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/.config/sops/age/{{ vars.PROJECT_NAME }}.keys.txt"

[tasks.lint]
description = "Run lint"
run = "prek run --all-files --color always"

[tasks."lint:ansible"]
description = "Run ansible-lint"
run = "SOPS_ANSIBLE_AWX_DISABLE_VARS_PLUGIN_TEMPORARILY=1 ansible-lint"

[tasks.bump-version]
description = "Bump the project version"
run = "bump-my-version bump patch"

[tasks.git-push]
description = "Push the current branch and related tags"
run = "git push --follow-tags origin HEAD"

[tasks.clean]
description = "Remove Ansible installation artifacts (virtualenv, external collections, external roles, etc)"
run = [
  "rm -rf -- '{{ vars.VENV_DIR }}'",
  "git clean -fdx -- '{{ vars.COLLECTIONS_PATH }}' '{{ vars.ROLES_PATH }}'",
]

[tasks.install]
description = "Install dependencies"
alias = "i"
run = [
  "uv pip install -r requirements.txt",
  "ansible-galaxy collection install --upgrade --requirements-file requirements.yml --collections-path '{{ vars.COLLECTIONS_PATH }}'",
  "ansible-galaxy role install --role-file requirements.yml --roles-path '{{ vars.ROLES_PATH }}'",
]

[tasks.show-env]
description = "Print information about the environment"
run = [
  "ansible --version",
  "ansible-galaxy collection list",
  "ansible-galaxy role list",
]

[tasks."sops:key"]
description = "Install the SOPS age key from Doppler"
run = [
  'mkdir -p -m 700 "{{ env.SOPS_AGE_KEY_FILE | dirname }}"',
  'doppler secrets get SOPS_AGE_KEY --project {{ vars.PROJECT_NAME }} --plain | install -m 600 /dev/stdin "{{ env.SOPS_AGE_KEY_FILE }}"',
]
