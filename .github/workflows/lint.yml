---
name: lint

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Install project dependencies
        run: mise run install
      - name: Run lint
        run: mise run lint
      - name: Run ansible-lint
        run: mise run lint:ansible
