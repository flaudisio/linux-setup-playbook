---
name: pre-commit

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Run pre-commit
        run: |
          mise use pre-commit@4
          mise run pre-commit
