---
# Role directories here use hyphens, which the Galaxy role-name pattern rejects.
role_name_check: 2
dependency:
  name: galaxy
  options:
    ignore-errors: true
driver:
  name: docker
platforms:
  # Omnitruck publishes no Cinc Workstation build for Ubuntu 26.04 yet.
  - name: ${MOLECULE_PLATFORM_PREFIX:-cinc-workstation-}ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  options:
    diff: true
