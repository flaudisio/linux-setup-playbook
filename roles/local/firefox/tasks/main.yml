---
- name: Check if snap command exists
  ansible.builtin.command: snap --version
  register: _snap_version
  changed_when: false
  failed_when: false
  tags: firefox:snap

- name: Ensure Firefox snap is absent
  community.general.snap:
    name: firefox
    state: absent
  when: _snap_version.rc == 0
  tags: firefox:snap

- name: Ensure old APT sources are absent
  community.general.file_remove:
    path: /etc/apt/sources.list.d
    pattern: mozilla.list*
  tags:
    - firefox:repo
    - firefox:install

- name: Download repository key
  ansible.builtin.get_url:
    url: "{{ firefox_apt_repo_key_url }}"
    dest: "{{ firefox_apt_repo_key_file }}"
    owner: root
    group: root
    mode: "0644"
  tags:
    - firefox:repo
    - firefox:install

- name: Configure repository
  ansible.builtin.deb822_repository:
    name: "{{ firefox_apt_repo_name }}"
    types: deb
    uris: "{{ firefox_apt_repo_uri }}"
    suites: "{{ firefox_apt_repo_suite }}"
    components: "{{ firefox_apt_repo_component }}"
    signed_by: "{{ firefox_apt_repo_key_file }}"
    state: present
  notify: firefox - apt update
  tags:
    - firefox:repo
    - firefox:install

- name: Flush handlers to update the APT cache
  ansible.builtin.meta: flush_handlers
  tags:
    - firefox:repo
    - firefox:install

- name: Configure package priority to Mozilla repository
  ansible.builtin.copy:
    content: |
      # Managed by Ansible
      Package: firefox
      Pin: version /.*snap.*/
      Pin-Priority: -1
    dest: /etc/apt/preferences.d/firefox
    owner: root
    group: root
    mode: "0644"
  tags:
    - firefox:repo
    - firefox:install

- name: Install package
  ansible.builtin.apt:
    name: firefox
    state: present
  tags: firefox:install

- name: Set Firefox as default browser in Alternatives
  community.general.alternatives:
    name: "{{ item }}"
    link: /usr/bin/{{ item }}
    path: /usr/bin/firefox
    priority: 100
    state: selected
  loop:
    - gnome-www-browser
    - x-www-browser
  when: firefox_set_as_default_browser | bool
  tags: firefox:alternatives
