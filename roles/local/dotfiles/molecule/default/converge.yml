---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false
      when: ansible_facts["os_family"] == "Debian"

    - name: Wait for systemd to complete initialization  # noqa: command-instead-of-module
      ansible.builtin.command: >
        systemctl is-system-running
      register: systemctl_status
      until: >
        "running" in systemctl_status.stdout
        or "degraded" in systemctl_status.stdout
      retries: 10
      delay: 6
      changed_when: false
      failed_when: systemctl_status.rc > 1
      when: ansible_facts["service_mgr"] == "systemd"

    - name: Install git for the fixture repository
      # The scenario builds its dotfiles repository with git before the role runs.
      ansible.builtin.apt:
        name: git
        state: present

    - name: Create a fixture dotfiles repository
      ansible.builtin.shell: |
        set -eu
        install -d /tmp/dotfiles-src/src/.config/htop
        printf 'export EDITOR=vim\n' > /tmp/dotfiles-src/src/.bash_aliases
        printf 'hide_kernel_threads=1\n' > /tmp/dotfiles-src/src/.config/htop/htoprc
        git init -q --initial-branch=main /tmp/dotfiles-src
        git -C /tmp/dotfiles-src add --all
        git -C /tmp/dotfiles-src -c user.email=molecule@example.com -c user.name=Molecule commit -q -m fixture
      args:
        creates: /tmp/dotfiles-src/.git

  roles:
    - role: dotfiles
      vars:
        dotfiles_repo_url: /tmp/dotfiles-src
        dotfiles_home: "{{ ansible_facts['user_dir'] }}"
        dotfiles_repo_local_dest: "{{ ansible_facts['user_dir'] }}/.files"
