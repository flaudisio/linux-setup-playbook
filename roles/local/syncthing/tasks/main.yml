---
- name: Install repository key
  ansible.builtin.get_url:
    url: "{{ syncthing_apt_repo_key_url }}"
    dest: "{{ syncthing_apt_repo_key_file }}"
    force: true
    owner: root
    group: root
    mode: "0644"
  tags:
    - syncthing:repo
    - syncthing:install

- name: Ensure old APT sources are absent
  community.general.file_remove:
    path: /etc/apt/sources.list.d
    pattern: syncthing.list*
  tags:
    - syncthing:repo
    - syncthing:install

- name: Configure repository
  ansible.builtin.deb822_repository:
    name: "{{ syncthing_apt_repo_name }}"
    types: deb
    uris: "{{ syncthing_apt_repo_uri }}"
    suites: "{{ syncthing_apt_repo_suite }}"
    components: "{{ syncthing_apt_repo_component }}"
    signed_by: "{{ syncthing_apt_repo_key_file }}"
    state: present
  notify: syncthing - apt update
  tags:
    - syncthing:repo
    - syncthing:install

- name: Flush handlers to update the APT cache
  ansible.builtin.meta: flush_handlers
  tags:
    - syncthing:repo
    - syncthing:install

- name: Install packages
  ansible.builtin.apt:
    name: syncthing
    state: present
  tags: syncthing:install

- name: Enable and run systemd service (user level)
  ansible.builtin.systemd_service:
    name: syncthing
    state: started
    enabled: true
    scope: user
  become: false
  when:
    - syncthing_enable_user_service | bool
    - ansible_facts["service_mgr"] == "systemd"
    - ansible_facts["user_id"] != "root"
  tags: syncthing:service
