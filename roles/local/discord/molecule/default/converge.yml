---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false
      when: ansible_facts["os_family"] == "Debian"

    - name: Wait for systemd to complete initialization  # noqa: command-instead-of-module
      ansible.builtin.command: >
        systemctl is-system-running
      register: systemctl_status
      until: >
        "running" in systemctl_status.stdout
        or "degraded" in systemctl_status.stdout
      retries: 10
      delay: 6
      changed_when: false
      failed_when: systemctl_status.rc > 1
      when: ansible_facts["service_mgr"] == "systemd"

    - name: Install the ALSA library the vendor package depends on
      # python-apt cannot satisfy a versioned dependency from libasound2t64's
      # Provides, and a desktop image would already ship it.
      ansible.builtin.apt:
        name: libasound2t64
        state: present

  roles:
    - role: discord
