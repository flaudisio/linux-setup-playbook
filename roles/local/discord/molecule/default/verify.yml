---
- name: Verify
  hosts: all

  vars_files:
    - ../../defaults/main.yml

  tasks:
    - name: Read the installed discord version
      ansible.builtin.command:
        cmd: dpkg-query --showformat='${Version}' --show discord
      register: _discord_version
      changed_when: false
      failed_when: false

    - name: Assert discord is installed
      ansible.builtin.assert:
        that:
          - _discord_version.rc == 0
          - _discord_version.stdout | length > 0
        success_msg: "discord {{ _discord_version.stdout }}"
    - name: Stat the Discord launcher
      ansible.builtin.stat:
        path: "/usr/bin/discord"
      register: _discord_launcher

    - name: Assert the Discord launcher
      ansible.builtin.assert:
        that:
          - _discord_launcher.stat.exists
          - _discord_launcher.stat.executable
